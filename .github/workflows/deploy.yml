name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Build and Push Backend
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/smart-irrigation-backend:latest

      - name: Build and Push Frontend
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/smart-irrigation-frontend:latest

      - name: Deploy to ECS
        if: env.AWS_ACCESS_KEY_ID != ''
        # This step assumes an ECS cluster and service already exist.
        # It would typically update the task definition.
        run: |
          echo "Updating ECS service..."
          # aws ecs update-service --cluster production --service smart-irrigation --force-new-deployment
